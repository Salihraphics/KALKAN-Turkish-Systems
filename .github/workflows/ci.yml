name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (MSVC) — build, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Run kalkan.exe, show its output, and fail unless the exit code matches.
          function Invoke-Kalkan([int]$Expect, [string[]]$KArgs) {
            $p = Start-Process -FilePath ./target/release/kalkan.exe -ArgumentList $KArgs `
                 -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
            Get-Content out.txt, err.txt
            if ($p.ExitCode -ne $Expect) {
              throw "kalkan $($KArgs -join ' ') exited with $($p.ExitCode), expected $Expect"
            }
          }
          Invoke-Kalkan 0 @('--version')
          Invoke-Kalkan 0 @('--print-default-config')
          Copy-Item out.txt kalkan.toml
          Invoke-Kalkan 0 @('--config', 'kalkan.toml', '--check-config')
          Set-Content bad.toml "[monitor]`nsample_interval_ms = 5"
          Invoke-Kalkan 1 @('--config', 'bad.toml', '--check-config')
          Invoke-Kalkan 2 @('--no-such-flag')
          Invoke-Kalkan 2 @('--screenshots', 'x')
      - name: GUI self-test (real window, scripted clicks, screenshots)
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath ./target/release/kalkan.exe `
               -ArgumentList @('--config', 'missing.toml', '--self-test', '--screenshots', 'screenshots') `
               -Wait -PassThru -NoNewWindow `
               -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          Get-Content selftest.txt, selftest-err.txt
          if ($p.ExitCode -ne 0) { throw "GUI self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: gui-screenshots
          path: |
            screenshots/
            selftest.txt
            selftest-err.txt
      - uses: actions/upload-artifact@v5
        with:
          name: kalkan-windows-x64
          path: target/release/kalkan.exe

  linux:
    name: Linux — platform-independent crates + Windows cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo build --release --target x86_64-pc-windows-gnu
