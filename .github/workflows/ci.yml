name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (MSVC) — build, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Smoke test
        shell: pwsh
        run: |
          ./target/release/kalkan.exe --version
          ./target/release/kalkan.exe --print-default-config > kalkan.toml
          ./target/release/kalkan.exe --config kalkan.toml --check-config
          ./target/release/kalkan.exe --config kalkan.toml
      - uses: actions/upload-artifact@v4
        with:
          name: kalkan-windows-x64
          path: target/release/kalkan.exe

  linux:
    name: Linux — platform-independent crates + Windows cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo build --release --target x86_64-pc-windows-gnu
